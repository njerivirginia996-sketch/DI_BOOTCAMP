<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Create a solar system</title>
        <style>
            body {
                margin: 0;
                background: black;
                min-height: 100vh;
                overflow: hidden;
            }

            .listPlanets {
                position: relative;
                width: 100vw;
                height: 100vh;
                background: radial-gradient(circle at center, #111 0%, #000 60%);
            }

            .planet {
                position: absolute;
                border-radius: 50%;
                border: 2px solid rgba(255, 255, 255, 0.7);
                color: white;
                font-size: 12px;
                text-align: center;
                display: flex;
                justify-content: center;
                align-items: center;
                transform: translate(-50%, -50%);
                box-shadow: inset -8px -8px 12px rgba(0,0,0,0.3),
                            inset 8px 8px 10px rgba(255,255,255,0.08);
            }

            .planet span {
                pointer-events: none;
                text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            }

            .moon {
                position: absolute;
                border-radius: 50%;
                background: #e9edf5;
                border: 2px solid rgba(255,255,255,0.7);
                box-shadow: 0 0 4px rgba(255,255,255,0.4);
            }
        </style>
    </head>
    <body>

    <section class="listPlanets"></section>

    <script src="dailychallengeplanets.js"></script>
    </body>
</html>
