<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Challenge: Mad Libs</title>
	</head>
	<body>
		<h1>Mad Libs</h1>

		<form id="libform">
			<label for="noun">Noun:</label>
			<input type="text" id="noun" name="noun" /><br />

			<label for="adjective">Adjective:</label>
			<input type="text" id="adjective" name="adjective" /><br />

			<label for="person">Someone's Name:</label>
			<input type="text" id="person" name="person" /><br />

			<label for="verb">Verb:</label>
			<input type="text" id="verb" name="verb" /><br />

			<label for="place">A place:</label>
			<input type="text" id="place" name="place" /><br />

			<button type="submit" id="lib-button">Lib it!</button>
			<button type="button" id="shuffle-button">Shuffle</button>
		</form>

		<p>Generated story: <span id="story"></span></p>

		<script src="script.js"></script>
	</body>
</html>
