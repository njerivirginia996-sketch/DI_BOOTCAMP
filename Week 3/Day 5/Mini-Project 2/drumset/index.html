<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drumset</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="rig">
  <div class="rig-head">
    <h1>DRUMSET</h1>
    <span>click a pad, or use your keyboard</span>
  </div>

  <div class="pads">
    <button class="drum" data-key="KeyA"><span class="key">A</span><span class="label">Kick</span></button>
    <button class="drum" data-key="KeyS"><span class="key">S</span><span class="label">Snare</span></button>
    <button class="drum" data-key="KeyD"><span class="key">D</span><span class="label">Hi-Hat</span></button>
    <button class="drum" data-key="KeyF"><span class="key">F</span><span class="label">Tom 1</span></button>
    <button class="drum" data-key="KeyG"><span class="key">G</span><span class="label">Tom 2</span></button>
    <button class="drum" data-key="KeyH"><span class="key">H</span><span class="label">Floor Tom</span></button>
    <button class="drum" data-key="KeyJ"><span class="key">J</span><span class="label">Ride</span></button>
    <button class="drum" data-key="KeyK"><span class="key">K</span><span class="label">Crash</span></button>
  </div>

  <div class="foot">A S D F G H J K — 8 pads, 8 keys</div>
</div>

<script src="script.js"></script>
</body>
</html>
