
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Currency Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="note">
  <header class="note-header">
    <span class="mark">‡</span>
    <h1>Currency Exchange</h1>
    <span class="mark">‡</span>
  </header>
  <p class="subtitle">Live rates · two-source lookup</p>

  <div class="rule"></div>

  <section class="field">
    <label for="amount">Amount</label>
    <input type="number" id="amount" value="100" min="0" step="any" inputmode="decimal" />
  </section>

  <section class="pair">
    <div class="stub">
      <label for="fromCurrency">From</label>
      <select id="fromCurrency" disabled>
        <option>Loading…</option>
      </select>
    </div>

    <button class="swap-btn" id="swapBtn" title="Swap currencies" aria-label="Swap currencies" disabled>
      ⇆
    </button>

    <div class="stub">
      <label for="toCurrency">To</label>
      <select id="toCurrency" disabled>
        <option>Loading…</option>
      </select>
    </div>
  </section>

  <div class="tear-line" aria-hidden="true"></div>

  <button class="convert-btn" id="convertBtn" disabled>Convert</button>

  <section class="board">
    <div class="board-inner" id="boardInner">
      <span class="board-msg" id="boardMsg">Fetching currency list…</span>
      <span class="board-result hidden" id="boardResult"></span>
    </div>
    <span class="board-caption" id="boardCaption"></span>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
