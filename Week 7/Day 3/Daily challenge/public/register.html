<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | User Registry</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/forms.js" defer></script>
</head>
<body>
    <main class="auth-shell">
        <a class="brand" href="/">USER REGISTRY <span> / 01</span></a>
        <section class="form-panel">
            <p class="kicker">NEW PROFILE</p>
            <h1>Create your account</h1>
            <p class="intro">Enter your details to join the registry.</p>
            <form id="register-form" data-form="register" novalidate>
                <div class="field-grid">
                    <label>Name<input name="name" autocomplete="given-name" required></label>
                    <label>Last Name<input name="lastName" autocomplete="family-name" required></label>
                </div>
                <label>Email<input name="email" type="email" autocomplete="email" required></label>
                <label>Username<input name="username" minlength="2" maxlength="20" autocomplete="username" required></label>
                <label>Password<input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
                <p class="message" aria-live="polite" role="status"></p>
                <button class="submit" type="submit" disabled>Create account <span aria-hidden="true">↗</span></button>
            </form>
            <p class="switch">Already registered? <a href="/">Sign in</a></p>
        </section>
        <footer>DEMO USER MANAGEMENT API <span>EXPRESS / JSON STORAGE</span></footer>
    </main>
</body>
</html>
